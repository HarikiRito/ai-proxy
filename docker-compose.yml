services:
  data-init:
    image: alpine:3.23
    command: chown 10001:10001 /data
    volumes:
      - data:/data

  migrate:
    image: arigaio/atlas:latest
    user: "10001:10001"
    command: migrate apply --url sqlite:///data/app.db?_fk=1 --dir file:///migrations
    volumes:
      - data:/data
      - ./backend/migrations:/migrations:ro
    depends_on:
      data-init:
        condition: service_completed_successfully

  api:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: file:/data/app.db?_pragma=foreign_keys(1)
    ports:
      - "8080:8080"
    volumes:
      - data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  data:
