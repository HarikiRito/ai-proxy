services:
  data-init:
    image: alpine:3.23
    command: chown 10001:10001 /data
    volumes:
      - data:/data

  migrate:
    image: arigaio/atlas:1.3.9
    user: "10001:10001"
    command: migrate apply --url sqlite:///data/app.db?_fk=1 --dir file:///migrations
    volumes:
      - data:/data
      - ./backend/migrations:/migrations:ro
    depends_on:
      data-init:
        condition: service_completed_successfully

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: file:/data/app.db?_pragma=foreign_keys(1)&_pragma=busy_timeout(5000)&_txlock=immediate
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_ISSUER: ${WORKOS_ISSUER:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      WORKOS_DEV_MODE: ${WORKOS_DEV_MODE:-false}
      MASTER_KEY: ${MASTER_KEY:-}
      # the api reaches the sidecar optionally at http://sidecar:3000 (set per provider in the UI)
    volumes:
      - data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  sidecar:
    build: ./sidecar
    init: true
    restart: unless-stopped
    volumes:
      - sidecar-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
  sidecar-data:
