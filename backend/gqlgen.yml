schema:
  - internal/graph/schema/*.gql

exec:
  filename: internal/graph/generated.go
  package: graph

model:
  filename: internal/graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph
  filename_template: "{name}.resolvers.go"

models:
  Provider:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/providers.Provider
  ProviderKey:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/providers.Key
  ProviderInput:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/providers.ProviderInput
  ProviderKeyInput:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/providers.KeyInput
  ProviderKeyAuthMode:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/providers.AuthMode
    enum_values:
      API_KEY:
        value: github.com/HarikiRito/ai-proxy/backend/internal/modules/providers.AuthAPIKey
      SETUP_TOKEN:
        value: github.com/HarikiRito/ai-proxy/backend/internal/modules/providers.AuthSetupToken
      LOGIN_DIR:
        value: github.com/HarikiRito/ai-proxy/backend/internal/modules/providers.AuthLoginDir
  ProviderKind:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/providers.Kind
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
  ProxyKey:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/proxykeys.Key
  ProxyKeyStatus:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/proxykeys.Status
  CreateProxyKeyInput:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/proxykeys.CreateInput
  VirtualModel:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/virtualmodels.Model
  VirtualModelTier:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/virtualmodels.Tier
  VirtualModelEntry:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/virtualmodels.Entry
  VirtualModelKind:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/virtualmodels.Kind
  DistributionStrategy:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/virtualmodels.Strategy
  EntryStatus:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/virtualmodels.Status
  CreateVirtualModelInput:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/virtualmodels.CreateInput
  UpdateVirtualModelInput:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/virtualmodels.UpdateInput
  TierInput:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/virtualmodels.TierInput
  EntryInput:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/virtualmodels.EntryInput
  Settings:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/settings.Settings
  SettingsInput:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/settings.Input
  UsageRecord:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/usage.Record
  UsageRecordPage:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/usage.Page
  UsageFilter:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/usage.Filter
  UsageGroup:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/usage.Group
  UsageTotal:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/usage.Total
  LiveKey:
    model: github.com/HarikiRito/ai-proxy/backend/internal/modules/routing.KeyStatus
