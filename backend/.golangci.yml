version: "2"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/HarikiRito/ai-proxy
  exclusions:
    generated: strict
    paths:
      - internal/ent
      - generated\.go$
      - models_gen\.go$

linters:
  default: none
  enable:
    - revive
    - nestif
    - gocognit
    - funlen
    - dupl
    - depguard
    - forbidigo
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - gosec
    - bodyclose
    - contextcheck
    - unused
    - ineffassign
  settings:
    revive:
      rules:
        - name: max-control-nesting
          arguments: [3]
        - name: file-length-limit
          arguments:
            - max: 700
        - name: function-length
          arguments: [50, 0]
        - name: cognitive-complexity
          arguments: [15]
    nestif:
      min-complexity: 5
    gocognit:
      min-complexity: 15
    funlen:
      lines: 60
      statements: 40
    dupl:
      threshold: 100
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: use the slog logger
        - pattern: ^log\.(Print|Fatal|Panic).*$
          msg: use the slog logger
    depguard:
      rules:
        # Module boundaries: modules talk through facades or consumer-defined interfaces only.
        # When adding a module, add its entity pkg (internal/ent/<entity>) to every other rule's deny list.
        embed:
          files: ["**/internal/**"]
          deny:
            - pkg: github.com/HarikiRito/ai-proxy/web
              desc: only cmd/api (the composition root) embeds the SPA
        platform:
          files: ["**/internal/platform/**"]
          deny:
            - pkg: github.com/HarikiRito/ai-proxy/backend/internal/modules
              desc: platform must not import domain modules
            - pkg: github.com/HarikiRito/ai-proxy/backend/internal/graph
              desc: platform must not import graph
            - pkg: github.com/HarikiRito/ai-proxy/backend/internal/events
              desc: platform must not import events
        events:
          files: ["**/internal/events/**"]
          deny:
            - pkg: github.com/HarikiRito/ai-proxy/backend/internal
              desc: events is a leaf package
        modules:
          files: ["**/internal/modules/**"]
          deny:
            - pkg: github.com/HarikiRito/ai-proxy/backend/internal/graph
              desc: modules must not import graph
        health:
          files: ["**/internal/modules/health/**"]
          deny:
            - pkg: github.com/HarikiRito/ai-proxy/backend/internal/ent
              desc: health owns no tables, and must not read other modules' entities
        providers-tables:
          files: ["**/internal/modules/**", "!**/internal/modules/providers/**"]
          deny:
            - pkg: github.com/HarikiRito/ai-proxy/backend/internal/ent/provider
              desc: providers owns these tables; use its facade
            - pkg: github.com/HarikiRito/ai-proxy/backend/internal/ent/providerkey
              desc: providers owns these tables; use its facade
        graph:
          files: ["**/internal/graph/**", "!**/internal/graph/generated.go"]
          deny:
            - pkg: github.com/HarikiRito/ai-proxy/backend/internal/ent
              desc: resolvers call module facades only
  exclusions:
    generated: strict
    paths:
      - internal/ent
      - generated\.go$
      - models_gen\.go$
    rules:
      - path: _test\.go
        linters: [funlen, dupl, gosec, forbidigo]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
