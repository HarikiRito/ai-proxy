enum ProviderKind {
  openai_compatible
  anthropic
  claude_subscription
}

"How a key's secret is used: an API key, a Claude setup token, or the name of a logged-in account directory (subscription providers only)."
enum ProviderKeyAuthMode {
  API_KEY
  SETUP_TOKEN
  LOGIN_DIR
}

type Provider {
  id: ID!
  name: String!
  kind: ProviderKind!
  baseUrl: String!
  enabled: Boolean!
  "Model ids this provider serves; suggestions only, not enforced."
  models: [String!]!
  cacheAffinitySeconds: Int!
  "Sum of max in flight over enabled keys."
  capacity: Int!
  keys: [ProviderKey!]!
}

type ProviderKey {
  id: ID!
  name: String!
  enabled: Boolean!
  maxInFlight: Int!
  weight: Int!
  "Never the secret: a partial hint that reveals more only for longer keys."
  maskedKey: String!
  authMode: ProviderKeyAuthMode!
  "Setup tokens only."
  tokenCreatedAt: Time
  "Setup tokens only: created plus 365 days."
  tokenExpiresAt: Time
}

"Create needs name, kind and baseUrl; update changes only the fields given."
input ProviderInput {
  name: String
  kind: ProviderKind
  baseUrl: String
  enabled: Boolean
  models: [String!]
  cacheAffinitySeconds: Int
}

"""
Add needs name, secret and maxInFlight (and authMode on claude_subscription providers: SETUP_TOKEN or LOGIN_DIR; other providers take API_KEY, the default).
Update changes only the fields given (a secret replaces the key; changing authMode needs a secret).
LOGIN_DIR secret is the account directory name, tokenCreatedAt (SETUP_TOKEN only, not in the future) defaults to now when the secret is set.
"""
input ProviderKeyInput {
  name: String
  secret: String
  enabled: Boolean
  maxInFlight: Int
  weight: Int
  authMode: ProviderKeyAuthMode
  tokenCreatedAt: Time
}

extend type Query {
  providers: [Provider!]!
}

extend type Mutation {
  createProvider(input: ProviderInput!): Provider!
  updateProvider(id: ID!, input: ProviderInput!): Provider!
  deleteProvider(id: ID!): Boolean!
  addProviderKey(providerId: ID!, input: ProviderKeyInput!): ProviderKey!
  updateProviderKey(id: ID!, input: ProviderKeyInput!): ProviderKey!
  deleteProviderKey(id: ID!): Boolean!
}
