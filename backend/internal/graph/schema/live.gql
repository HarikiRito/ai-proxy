"Live state of one provider key, from the routing engine."
type LiveKey {
  providerId: ID!
  providerName: String!
  keyId: ID!
  keyName: String!
  "True when both the provider and the key are enabled."
  enabled: Boolean!
  maxInFlight: Int!
  inFlight: Int!
  free: Int!
  "Set only while the key is cooling down."
  cooldownUntil: Time
  "needs_login while a subscription account is held back after a 401/403 (retried after 10 minutes), expired for a setup token past its lifetime, else empty."
  flag: String
}

extend type Query {
  liveStatus: [LiveKey!]!
}
